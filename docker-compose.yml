services:
  defi_stats:
    container_name: api
    env_file:
      - ./api/.env
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      - ./api:/home/komodian/api
    ports:
      - 127.0.0.1:7068:7068
    depends_on:
      - pgsqldb
      - komodefi_8762
      - komodefi_6133
      - memcached
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    restart: always
    command: ["poetry", "run", "python", "main.py"]
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  komodefi_8762:
    container_name: komodefi_8762
    env_file:
      - ./mm2_8762/.env
    build:
      context: ./mm2_8762
      dockerfile: Dockerfile
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      - ./mm2_8762:/home/komodian/mm2
    ports:
      - 127.0.0.1:7862:7862
      - 127.0.0.1:42845:42845
      - 127.0.0.1:42855:42855
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    restart: always
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  komodefi_6133:
    container_name: komodefi_6133
    env_file:
      - ./mm2_6133/.env
    build:
      context: ./mm2_6133
      dockerfile: Dockerfile
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      - ./mm2_6133:/home/komodian/mm2
    ports:
      - 127.0.0.1:7783:7783
      - 127.0.0.1:32326:32326
      - 127.0.0.1:32336:32336
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    restart: always
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  memcached:
    container_name: memcached
    image: memcached:latest
    ports:
      - "127.0.0.1:11211:11211"
    restart: always
    depends_on:
      - pgsqldb
    command: ["memcached", "-I", "100m", "-m", "500m"]
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  pgsqldb:
    container_name: pgsqldb
    image: postgres:12.17
    restart: always
    volumes:
      - /home/tech/defi_stats/docker-data/pgsqldb:/var/lib/postgresql/data
      - ./api/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    env_file:
      - ./api/.env
    depends_on:
      - komodefi_6133
    ports:
      - "127.0.0.1:5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

